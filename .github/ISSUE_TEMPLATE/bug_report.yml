name: Bug Report
description: Report something that isn't working as expected
title: "[BUG] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check the following before submitting your bug report.
      options:
        - label: I have searched existing issues to ensure this bug has not already been reported.
          required: true
        - label: I am using the latest version of RANT.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one or two sentence description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Browser/version
      placeholder: e.g., Windows 11, Chrome 116
  - type: input
    id: rant-version
    attributes:
      label: RANT Version
      description: Which version or commit of RANT are you using?
      placeholder: e.g., v1.2.0 or commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Errors
      description: Please paste any relevant browser console errors or backend server logs.
      render: shell
