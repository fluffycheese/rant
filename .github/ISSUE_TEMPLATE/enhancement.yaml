name: Enhancement
description: Suggest an improvement or new feature
title: "[ENHANCEMENT] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this feature has not already been requested.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one or two sentence description of what you'd like added or changed.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve, or what workflow does it improve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Approach
      description: How you imagine this working. Doesn't need to be final, just a starting point for discussion.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought about, and why you didn't go with them.
