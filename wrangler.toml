name = "rant"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist/public"

# The compiled worker entry point — placed inside the Pages build output
# so CF Pages picks it up automatically.
main = "dist/public/_worker.js"

[[d1_databases]]
binding = "DB"
database_name = "rant-db"
database_id = "<YOUR_D1_DATABASE_ID>"
